name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend-admin/**'
      - 'frontend-viewer/**'
      - '.github/workflows/frontend-test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend-admin/**'
      - 'frontend-viewer/**'

jobs:
  test-admin:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci
      
      - name: Run linter
        working-directory: frontend-admin
        run: npm run lint
      
      - name: Build
        working-directory: frontend-admin
        run: npm run build
      
      - name: Run tests
        working-directory: frontend-admin
        run: npm test || echo "Tests not fully implemented"
  
  test-viewer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend-viewer/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend-viewer
        run: npm ci
      
      - name: Run linter
        working-directory: frontend-viewer
        run: npm run lint
      
      - name: Build
        working-directory: frontend-viewer
        run: npm run build
      
      - name: Run tests
        working-directory: frontend-viewer
        run: npm test || echo "Tests not fully implemented"
